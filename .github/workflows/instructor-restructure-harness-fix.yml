name: instructor-restructure-harness-fix

on:
  push:
    branches: [integrate/instructor-restructure-20260914]
    paths:
      - .github/workflows/instructor-restructure-harness-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/instructor-restructure-20260914
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Align catalog and regression contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/lib/data-templates/catalog.ts')
          s=p.read_text()
          old='''export const CATALOG: TemplateDef[] = CATALOG_DEFINITIONS.map((entry) => {\n  const template = TEMPLATES[catalogImportEntity(entry.id)];\n  if (!template) return entry;\n  return {\n    ...entry,\n    sheetName: template.sheetName,\n    columns: template.columns.map((column) => ({\n      header: column.header,\n      required: column.required,\n      example: column.example,\n      allowed: column.enumValues?.join(" | "),\n      description: entry.columns.find((old) => old.header === column.header)?.description,\n    })),\n    sampleRows: [template.columns.map((column) => column.example ?? "")],\n  };\n});'''
          new='''export const CATALOG: TemplateDef[] = CATALOG_DEFINITIONS.map((entry) => {\n  const template = TEMPLATES[catalogImportEntity(entry.id)];\n  if (!template) return entry;\n  const visibleColumns = template.columns.filter((column) => !column.templateHidden);\n  return {\n    ...entry,\n    sheetName: template.sheetName,\n    columns: visibleColumns.map((column) => ({\n      header: column.header,\n      required: column.required,\n      example: column.example,\n      allowed: column.enumValues?.join(" | "),\n      description: entry.columns.find((old) => old.header === column.header)?.description,\n    })),\n    sampleRows: [visibleColumns.map((column) => column.example ?? "")],\n  };\n});'''
          if old not in s:
              raise RuntimeError('catalog mapping anchor not found')
          p.write_text(s.replace(old,new,1))

          p=Path('tests/harness/import-templates-final-audit.harness.ts')
          s=p.read_text()
          old='''    const expected = TEMPLATES[e].columns.map((c) => c.header);'''
          new='''    const expected = TEMPLATES[e].columns\n      .filter((c) => !c.templateHidden)\n      .map((c) => c.header);'''
          if old not in s:
              raise RuntimeError('harness expected headers anchor not found')
          p.write_text(s.replace(old,new,1))

          p=Path('tests/unified-data-preparation.test.ts')
          s=p.read_text()
          old='''      TEMPLATES[entity].columns.map((c) => [c.header, c.required, c.enumValues?.join(" | ")]),'''
          new='''      TEMPLATES[entity].columns\n        .filter((c) => !c.templateHidden)\n        .map((c) => [c.header, c.required, c.enumValues?.join(" | ")]),'''
          if old not in s:
              raise RuntimeError('unified guide columns anchor not found')
          s=s.replace(old,new,1)
          s=s.replace('assert.equal(CATALOG.find((c) => c.id === "instructors")?.columns.length, 19);','assert.equal(CATALOG.find((c) => c.id === "instructors")?.columns.length, 16);',1)
          s=s.replace('rows[0]["النصاب الأسبوعي (ساعة)"]','rows[0]["النصاب_الأساسي_الأسبوعي"]',1)
          s=s.replace('rows[0]["ساعات_إعفاء_إداري"]','rows[0]["ساعات_الإعفاء_الإداري"]',1)
          s=s.replace('rows[0]["اسم المدرس"]','rows[0]["الاسم_الافتراضي"]',1)
          p.write_text(s)

          p=Path('tests/preparation-workspace.test.tsx')
          s=p.read_text()
          s=s.replace('assert.ok(html.includes("ساعات_إعفاء_إداري"));','assert.ok(html.includes("ساعات_الإعفاء_الإداري"));',1)
          s=s.replace('assert.ok(html.includes("الجهة_الخارجية"));','assert.ok(html.includes("كلية_التبعية_رمز"));\n  assert.ok(!html.includes("الجهة_الخارجية"));',1)
          p.write_text(s)
          PY
      - name: Format
        run: bunx prettier --write src/lib/data-templates/catalog.ts tests/harness/import-templates-final-audit.harness.ts tests/unified-data-preparation.test.ts tests/preparation-workspace.test.tsx
      - name: Verify affected suites
        run: |
          bun run test:harness
          node --import tsx --test tests/preparation-workspace.test.tsx
          node --experimental-test-module-mocks --import tsx --test tests/instructor-sheet.test.ts tests/unified-data-preparation.test.ts
          bunx eslint src/lib/data-templates/catalog.ts tests/harness/import-templates-final-audit.harness.ts tests/unified-data-preparation.test.ts tests/preparation-workspace.test.tsx
          bunx tsc --noEmit
          bun run build
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name "OpenAI implementation bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/data-templates/catalog.ts tests/harness/import-templates-final-audit.harness.ts tests/unified-data-preparation.test.ts tests/preparation-workspace.test.tsx
          git commit -m "test(import): align guide and harness with instructor HR contract"
          git push origin HEAD:refs/heads/integrate/instructor-restructure-20260914
