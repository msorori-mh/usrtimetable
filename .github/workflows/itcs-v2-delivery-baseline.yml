name: itcs-v2-delivery-baseline
on:
  pull_request:
    paths:
      - 'docs/migrations-proposed/20260925_itcs_v2_delivery_baseline.sql'
      - 'docs/migrations-proposed/20260925_itcs_version_scoped_facts.sql'
      - 'docs/migrations-proposed/20260925_itcs_version_scoped_memberships.sql'
      - 'docs/migrations-proposed/20260925_itcs_version_scoped_overlap.sql'
      - 'docs/migrations-proposed/20260925_itcs_version_scoped_guards.sql'
      - 'docs/migrations-proposed/20260925_itcs_version_scoped_writer_integration.sql'
      - 'docs/migrations-proposed/20260925_itcs_exact_hour_waiver.sql'
      - 'docs/scheduler-repair/itcs-level-one-draft-reconciliation-plan.json'
      - 'tests/itcs-v2-delivery-baseline-db.sql'
      - 'tests/itcs-version-scoped-guards-db.sql'
      - 'tests/itcs-level-one-plan.mjs'
      - '.github/workflows/itcs-v2-delivery-baseline.yml'
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Verify the six assignments, group partitions and placements
        run: node tests/itcs-level-one-plan.mjs
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: itcs_v2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Published baseline capture, immutability and tenant scope
        env:
          PGPASSWORD: postgres
        run: psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d itcs_v2_test -f tests/itcs-v2-delivery-baseline-db.sql
      - name: Version-scoped freshness and session guards
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE itcs_guards_test'
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d itcs_guards_test -f tests/itcs-version-scoped-guards-db.sql
