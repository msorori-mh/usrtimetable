name: tmp-diagnostics
# Temporary (read-only token): produces the prettier/eslint --fix patch for files changed
# against main and the remaining lint and node:test failures, emitted as annotations.
on:
  push:
    branches: [audit-remediation]
    paths: [".github/workflows/tmp-diagnostics.yml", ".github/scripts/tmp-emit-annotations.py"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    name: diag shard ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Build report
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/out.txt"
          git fetch -q origin main
          FILES=$(git diff --name-only --diff-filter=ACMR origin/main HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs')
          echo "$FILES" | xargs bunx prettier --write > /dev/null 2>&1
          echo "$FILES" | xargs bunx eslint --fix > "$RUNNER_TEMP/eslint.txt" 2>&1
          echo "eslint exit $?" >> "$RUNNER_TEMP/eslint.txt"
          node scripts/run-all-tests.mjs --group=node > "$RUNNER_TEMP/node.txt" 2>&1
          echo "node exit $?" >> "$RUNNER_TEMP/node.txt"
          git diff > "$RUNNER_TEMP/fix.patch"
          {
            echo "=====ESLINT====="; tail -c 30000 "$RUNNER_TEMP/eslint.txt"
            echo "=====NODE====="; grep -E "^(✖|not ok|# fail|# pass|node exit|FAILED)|AssertionError|Error:" "$RUNNER_TEMP/node.txt" | head -150
            echo "=====SHA====="; sha256sum "$RUNNER_TEMP/fix.patch" | cut -d' ' -f1
            echo "=====PATCH====="; cat "$RUNNER_TEMP/fix.patch"
          } > "$OUT"
          wc -c "$OUT"
          exit 0
      - name: Emit part 1
        run: python3 .github/scripts/tmp-emit-annotations.py "$RUNNER_TEMP/out.txt" ${{ matrix.shard }} 1
      - name: Emit part 2
        run: python3 .github/scripts/tmp-emit-annotations.py "$RUNNER_TEMP/out.txt" ${{ matrix.shard }} 2
