name: tmp-diagnostics
# Temporary (read-only token): whole-repo lint without formatting and every unit test group.
on:
  push:
    branches: [audit-remediation]
    paths: [".github/workflows/tmp-diagnostics.yml", ".github/scripts/tmp-emit-annotations.py"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    name: diag shard ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Build report
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/out.txt"
          {
            echo "=====ESLINT====="
            bunx eslint . --rule 'prettier/prettier: off' -f unix 2>&1 | grep -v "warning" | tail -300
            for g in bun vitest node script; do
              echo "=====GROUP $g====="
              node scripts/run-all-tests.mjs --group=$g > "$RUNNER_TEMP/g.txt" 2>&1; echo "exit $?"
              grep -E "^(✖|not ok|\(fail\)| FAIL |FAILED)|AssertionError|Expected|Received|error:|Error:" "$RUNNER_TEMP/g.txt" | grep -v "^\s*at " | cut -c1-400 | head -120
            done
            echo "=====HARNESS====="
            bun run test:harness > "$RUNNER_TEMP/h.txt" 2>&1; echo "exit $?"
            grep -iE "fail|error|✖" "$RUNNER_TEMP/h.txt" | cut -c1-400 | head -60
          } > "$OUT" 2>&1
          exit 0
      - name: Emit part 1
        run: python3 .github/scripts/tmp-emit-annotations.py "$RUNNER_TEMP/out.txt" ${{ matrix.shard }} 1
      - name: Emit part 2
        run: python3 .github/scripts/tmp-emit-annotations.py "$RUNNER_TEMP/out.txt" ${{ matrix.shard }} 2
