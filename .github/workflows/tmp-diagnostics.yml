name: tmp-diagnostics
# Temporary: runs the failing gates and re-emits their output as annotations
# (read-only token). Removed once the gates are green.
on:
  push:
    branches: [audit-remediation]
    paths: [".github/workflows/tmp-diagnostics.yml", ".github/scripts/tmp-emit-annotations.py"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tsc
            flags: --tsc
            cmd: bunx tsc --noEmit --pretty false
          - name: vitest
            cmd: node scripts/run-all-tests.mjs --group=vitest
          - name: leadership
            cmd: node --import tsx --test tests/leadership.test.ts tests/academic-affairs.test.ts tests/leadership-room-capacity.test.ts tests/leadership-decisions.test.tsx tests/leadership-metrics-drilldown.test.ts tests/university-overview.test.tsx tests/teaching-demand-capacity.test.mjs
          - name: consistency
            cmd: bunx vitest run --config tests/vitest-bun-compat.config.mjs tests/report-assignment-scope.test.ts tests/teaching-assignment-query-invalidation.test.ts tests/schedule-assignment-eligibility.test.ts tests/program-timetable-coverage.test.ts tests/assignment-placement-context.test.ts && node --test tests/assignment-workspace-version-view.test.mjs
          - name: audit
            cmd: bun audit --audit-level=high
          - name: physical-pages
            cmd: |
              node --import tsx --test tests/rooms-executive.test.ts
              bun test tests/university-instructor-schedule.test.ts tests/student-print-memberships.test.ts
              npm install --prefix "$RUNNER_TEMP/report-qa" --no-package-lock @playwright/test@1.63.0
              node "$RUNNER_TEMP/report-qa/node_modules/@playwright/test/cli.js" install --with-deps chromium
              pip install "pymupdf==1.24.10"
              bunx vite --config scripts/reports-proof/vite.config.mts > "$RUNNER_TEMP/report-preview.log" 2>&1 &
              for i in {1..60}; do curl -fsS http://127.0.0.1:4173/repeated-header.html >/dev/null && break; sleep 1; done
              REPORT_QA_MODULES="$RUNNER_TEMP/report-qa/node_modules" node scripts/reports-proof/repeated-header.cjs
              echo "---- vite preview log"; cat "$RUNNER_TEMP/report-preview.log"
    name: diag ${{ matrix.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Run
        shell: bash
        run: |
          set +e
          ( ${{ matrix.cmd }} ) > "$RUNNER_TEMP/out.txt" 2>&1
          echo "EXIT CODE $?" >> "$RUNNER_TEMP/out.txt"
          exit 0
      - name: Emit part 1
        run: python3 .github/scripts/tmp-emit-annotations.py "$RUNNER_TEMP/out.txt" 1 ${{ matrix.flags }}
      - name: Emit part 2
        run: python3 .github/scripts/tmp-emit-annotations.py "$RUNNER_TEMP/out.txt" 2 ${{ matrix.flags }}
