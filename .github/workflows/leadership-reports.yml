name: leadership-reports
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/leadership*"
      - "tests/teaching-demand-capacity.test.mjs"
      - "tests/teaching-coverage*"
      - "supabase/migrations/*reporting.sql"
      - "tests/academic-staffing*"
      - "tests/executive-dashboard*"
      - "tests/university-overview*"
      - "supabase/migrations/*academic_affairs_executive_dashboard*"
      - "supabase/migrations/*university_leadership*"
      - ".github/workflows/leadership-reports.yml"
permissions:
  contents: read
jobs:
  leadership:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Roles and truthful presentation
        run: node --import tsx --test tests/leadership.test.ts tests/academic-affairs.test.ts tests/leadership-room-capacity.test.ts tests/leadership-decisions.test.tsx tests/leadership-metrics-drilldown.test.ts tests/university-overview.test.tsx tests/teaching-demand-capacity.test.mjs
      - name: PostgreSQL test dependency
        run: npm install --prefix "$RUNNER_TEMP/leadership-db" --no-package-lock @electric-sql/pglite@0.3.14
      - name: Teaching coverage, categories and payroll role boundaries
        run: |
          node --import tsx --test tests/teaching-coverage.test.ts tests/system-hours.test.ts
          LEADERSHIP_DB_MODULE="$RUNNER_TEMP/leadership-db/node_modules/@electric-sql/pglite/dist/index.js" node --test tests/teaching-coverage-db.test.mjs
      - name: Shared executive presentation and role scope
        run: node --import tsx --test tests/executive-dashboard-roles.test.tsx
      - name: Academic staffing readiness and development gate
        run: node --import tsx --test tests/academic-staffing.test.tsx
      - name: Academic affairs and dean executive access boundaries
        run: LEADERSHIP_DB_MODULE="$RUNNER_TEMP/leadership-db/node_modules/@electric-sql/pglite/dist/index.js" node --test tests/executive-dashboard-access-db.test.mjs
      - name: Read scope, write denial, mixed roles and university aggregates
        run: LEADERSHIP_DB_MODULE="$RUNNER_TEMP/leadership-db/node_modules/@electric-sql/pglite/dist/index.js" node --test tests/leadership-db.test.mjs
