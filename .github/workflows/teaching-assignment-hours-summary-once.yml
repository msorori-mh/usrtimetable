name: One-shot instructor assigned hours summary

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/teaching-assignment-hours-summary-once.yml

permissions:
  contents: write

jobs:
  patch_and_verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply patch
        run: python .github/scripts/teaching_assignment_hours_summary_once.py

      - name: Format changed files
        run: bunx prettier --write src/lib/teaching-assignments/instructor-name-search.ts src/routes/_authenticated/teaching-assignments.tsx tests/teaching-assignments-instructor-search.test.ts

      - name: Run focused tests
        run: bunx vitest run tests/teaching-assignments-instructor-search.test.ts

      - name: Lint changed files
        run: bunx eslint src/lib/teaching-assignments/instructor-name-search.ts src/routes/_authenticated/teaching-assignments.tsx tests/teaching-assignments-instructor-search.test.ts

      - name: Build
        run: bun run build

      - name: Check diff
        run: git diff --check

      - name: Commit implementation
        run: |
          git config user.name "openai-automation"
          git config user.email "openai-automation@users.noreply.github.com"
          git rm .github/workflows/teaching-assignment-hours-summary-once.yml
          git rm .github/scripts/teaching_assignment_hours_summary_once.py
          git add src/lib/teaching-assignments/instructor-name-search.ts src/routes/_authenticated/teaching-assignments.tsx tests/teaching-assignments-instructor-search.test.ts
          git commit -m "اعرض إجمالي ساعات المحاضر في الإسناد"
          git push origin HEAD:main
