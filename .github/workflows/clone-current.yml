name: clone-current
on:
  pull_request:
    paths:
      - 'src/lib/schedule-versions/**'
      - 'src/routes/_authenticated/schedule-versions.tsx'
      - 'tests/*clone*'
      - 'supabase/migrations/*atomic_current_assignment_clone*'
      - 'supabase/migrations/*clone_version_delivery_facts*'
      - 'supabase/migrations/*clone_fact_provenance*'
      - 'src/lib/itcs-cutover/**'
      - 'src/routes/_authenticated/itcs-cutover.tsx'
      - 'supabase/migrations/*version_scoped_assignments*'
      - 'supabase/migrations/*version_scoped_workload*'
      - 'supabase/migrations/*integrated_itcs_cutover*'
      - 'supabase/migrations/*scoped_cohort_batch_decisions*'
      - 'supabase/migrations/*scoped_assignment_college_guard*'
      - 'supabase/migrations/*scoped_effective_before_relink*'
      - 'supabase/migrations/*scoped_inactive_assignment_reuse*'
      - 'tests/*itcs*'
      - 'tests/fixtures/itcs-*.sql'
      - '.github/workflows/clone-current.yml'
permissions:
  contents: read
jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bun test tests/schedule-version-clone-identity.test.ts
      - run: npm install --prefix "$RUNNER_TEMP/clone-db" --no-package-lock @electric-sql/pglite@0.3.14
      - run: CLONE_DB_MODULE="$RUNNER_TEMP/clone-db/node_modules/@electric-sql/pglite/dist/index.js" node --test tests/clone-current-db.test.mjs
      - run: CLONE_DB_MODULE="$RUNNER_TEMP/clone-db/node_modules/@electric-sql/pglite/dist/index.js" node --test tests/clone-cross-college-exception-db.test.mjs
      - run: CLONE_DB_MODULE="$RUNNER_TEMP/clone-db/node_modules/@electric-sql/pglite/dist/index.js" node --test tests/clone-version-facts-db.test.mjs
      - run: CLONE_DB_MODULE="$RUNNER_TEMP/clone-db/node_modules/@electric-sql/pglite/dist/index.js" node --test tests/itcs-integrated-cutover-db.test.mjs tests/itcs-scoped-cohort-decisions-db.test.mjs tests/itcs-room-amendment-db.test.mjs
      - run: CLONE_DB_MODULE="$RUNNER_TEMP/clone-db/node_modules/@electric-sql/pglite/dist/index.js" node --test tests/itcs-review-proposal-db.test.mjs
      - run: CLONE_DB_MODULE="$RUNNER_TEMP/clone-db/node_modules/@electric-sql/pglite/dist/index.js" node --test tests/itcs-native-scope-db.test.mjs
