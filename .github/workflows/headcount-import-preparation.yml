name: headcount-import-preparation
on:
  push:
    branches: ["feat/scheduling-headcount-import"]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format scoped feature files and generate migration using Supabase CLI
        run: |
          bunx prettier --write src/lib/scheduling-headcount/import.ts src/lib/scheduling-headcount/import-workbook.ts src/lib/scheduling-headcount/api.ts src/components/data-onboarding/headcount-import-workspace.tsx src/components/data-onboarding/import-workspace.tsx src/routes/_authenticated/scheduling-headcounts.tsx tests/headcount-import.test.ts tests/headcount-workbook.test.ts tests/headcount-import-db.test.mjs .github/workflows/runtime-gates.yml
          bunx supabase migration new scheduling_headcount_import
          cp supabase/sql/scheduling_headcount_import.sql "$(find supabase/migrations -name '*_scheduling_headcount_import.sql')"
          mkdir -p /tmp/headcount-sources
          cp --parents src/lib/scheduling-headcount/import.ts src/lib/scheduling-headcount/import-workbook.ts src/lib/scheduling-headcount/api.ts src/components/data-onboarding/headcount-import-workspace.tsx src/components/data-onboarding/import-workspace.tsx src/routes/_authenticated/scheduling-headcounts.tsx tests/headcount-import.test.ts tests/headcount-workbook.test.ts tests/headcount-import-db.test.mjs .github/workflows/runtime-gates.yml supabase/migrations/*_scheduling_headcount_import.sql /tmp/headcount-sources
      - uses: actions/upload-artifact@v4
        with:
          name: headcount-formatted-sources
          path: /tmp/headcount-sources
          include-hidden-files: true
          retention-days: 1
