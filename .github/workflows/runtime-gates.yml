name: runtime-gates

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to checkout and gate (branch/SHA)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  gates:
    name: runtime-gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node for scheduling contract tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Compute diff range
        id: range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"
            fi
            BASE="$BEFORE"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Diff base: $BASE"

      - name: git diff --check
        shell: bash
        run: git diff --check "${{ steps.range.outputs.base }}" HEAD

      - name: Scoped ESLint (changed files only)
        shell: bash
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR "${{ steps.range.outputs.base }}" HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' || true)
          if [ -n "$FILES" ]; then
            echo "Linting changed files:"
            echo "$FILES"
            echo "$FILES" | xargs bunx eslint
          else
            echo "No lintable files changed — scoped ESLint PASS (vacuous)."
          fi

      - name: TypeScript (tsc --noEmit)
        run: bunx tsc --noEmit

      - name: Joint attendance and scheduling contracts
        run: node --test tests/compact.test.mjs tests/joint-attendance.test.mjs tests/v2-joint-orchestration.test.mjs tests/compact-worker-client.test.mjs tests/compact-atomic-service.test.mjs

      - name: Production build (vite build)
        run: bun run build

      - name: Static harness suite
        run: bun run test:harness

  atomic-compaction-db:
    name: Atomic compaction PostgreSQL proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compaction_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Atomic rollback, permissions and concurrency on disposable PostgreSQL
        env:
          COMPACTION_TEST_DISPOSABLE: "1"
          COMPACTION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/compaction_test
        run: node --test tests/compact-atomic-db.test.mjs

  prepare-atomic-migration:
    name: Generate reviewed atomic migration artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Create migration with the official CLI
        shell: bash
        run: |
          supabase --version
          supabase migration new --help
          supabase migration new atomic_schedule_compaction
          mapfile -t migration_paths < <(rg --files supabase/migrations -g '*_atomic_schedule_compaction.sql')
          test "${#migration_paths[@]}" -eq 1
          migration_path="${migration_paths[0]}"
          cp supabase/sql/atomic_schedule_compaction.sql "$migration_path"
          echo "MIGRATION_FILE=$migration_path"
          sha256sum "$migration_path"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-atomic-compaction-migration
          path: supabase/migrations/*_atomic_schedule_compaction.sql
          if-no-files-found: error
          retention-days: 14
