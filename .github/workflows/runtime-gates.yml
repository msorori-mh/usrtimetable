name: runtime-gates

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to checkout and gate (branch/SHA)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  gates:
    name: runtime-gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node for scheduling contract tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Compute diff range
        id: range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"
            fi
            BASE="$BEFORE"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Diff base: $BASE"

      - name: git diff --check
        shell: bash
        run: git diff --check "${{ steps.range.outputs.base }}" HEAD

      - name: Scoped ESLint (changed files only)
        shell: bash
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR "${{ steps.range.outputs.base }}" HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' || true)
          if [ -n "$FILES" ]; then
            echo "Linting changed files:"
            echo "$FILES"
            echo "$FILES" | xargs bunx eslint
          else
            echo "No lintable files changed — scoped ESLint PASS (vacuous)."
          fi

      - name: TypeScript (tsc --noEmit)
        run: bunx tsc --noEmit

      - name: Joint attendance and scheduling contracts
        run: node --import tsx --test tests/attendance-search.test.mjs tests/compact.test.mjs tests/joint-attendance.test.mjs tests/v2-joint-orchestration.test.mjs tests/compact-worker-client.test.mjs tests/compact-atomic-service.test.mjs

      - name: Production build (vite build)
        run: bun run build

      - name: Static harness suite
        run: bun run test:harness

      - name: Academic affairs report calculations
        run: node --import tsx --test tests/academic-affairs.test.ts

      - name: Instructor review filters and repair links
        run: node --import tsx --test tests/instructor-review.test.ts tests/preparation-workspace.test.tsx

      - name: Complete instructor workbook import
        run: node --experimental-test-module-mocks --import tsx --test tests/instructor-sheet.test.ts tests/unified-data-preparation.test.ts

      - name: Component-aware study plan readiness
        run: node --import tsx --test tests/study-plan-readiness.test.ts

      - name: Study plan course nature preview and saved payload
        run: node --experimental-test-module-mocks --import tsx --test tests/course-nature-import.test.ts

      - name: Cohort directory filters and visible selection
        run: node --import tsx --test tests/cohort-directory.test.ts

      - name: Time template classification and availability filters
        run: node --import tsx --test tests/time-template-directory.test.ts

      - name: Cohort generation empty-result and Arabic diagnostics
        run: node --import tsx --test tests/cohort-generation-messages.test.ts

      - name: Scheduling headcount workbook import
        run: node --import tsx --test tests/headcount-import.test.ts tests/headcount-workbook.test.ts

  atomic-compaction-db:
    name: Atomic compaction PostgreSQL proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compaction_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify the reviewed atomic migration
        run: cmp supabase/sql/atomic_schedule_compaction.sql supabase/migrations/20260911130524_atomic_schedule_compaction.sql
      - name: Atomic rollback, permissions and concurrency on disposable PostgreSQL
        env:
          COMPACTION_TEST_DISPOSABLE: "1"
          COMPACTION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/compaction_test
        run: node --test tests/compact-atomic-db.test.mjs

      - name: Study plan import room references, counters and rejection on disposable PostgreSQL
        env:
          PGPASSWORD: postgres
          PLAN_IMPORT_TEST_DISPOSABLE: "1"
          PLAN_IMPORT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/plan_import_test
        run: |
          createdb -h 127.0.0.1 -U postgres plan_import_test
          node --test tests/study-plan-import-db.test.mjs

      - name: Scheduling headcount import atomicity, permissions and concurrency
        env:
          PGPASSWORD: postgres
          HEADCOUNT_TEST_DISPOSABLE: "1"
          HEADCOUNT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/headcount_import_test
        run: |
          createdb -h 127.0.0.1 -U postgres headcount_import_test
          node --test tests/headcount-import-db.test.mjs

      - name: Cohort plan selection and atomic group generation
        env:
          PGPASSWORD: postgres
          COHORT_GENERATION_TEST_DISPOSABLE: "1"
          COHORT_GENERATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cohort_generation_test
        run: |
          createdb -h 127.0.0.1 -U postgres cohort_generation_test
          node --test tests/cohort-plan-generation-db.test.mjs

