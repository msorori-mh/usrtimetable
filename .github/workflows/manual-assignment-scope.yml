name: manual-assignment-scope
on:
  pull_request:
    paths:
      - "supabase/migrations/*manual_assignment_scope_consistency*"
      - "supabase/rollbacks/*manual_assignment_scope_consistency*"
      - "tests/manual-assignment-scope-db.test.mjs"
      - "tests/fixtures/manual-assignment-scope-functions.sql"
      - "tests/faculty-workflow*"
      - "supabase/migrations/*assignment_candidate_operational_scope*"
      - "supabase/rollbacks/*assignment_candidate_operational_scope*"
      - "tests/assignment-candidate-scope-db.test.mjs"
      - "tests/fixtures/assignment-candidate-scope.sql"
      - "supabase/migrations/*restore_historical_manual_assignment*"
      - "supabase/rollbacks/*restore_historical_manual_assignment*"
      - "tests/manual-assignment-restoration-db.test.mjs"
      - ".github/workflows/manual-assignment-scope.yml"
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: PostgreSQL test dependency
        run: npm install --prefix "$RUNNER_TEMP/faculty-db" --no-package-lock @electric-sql/pglite@0.3.14
      - name: Manual assignments, version scope and approval boundaries
        run: FACULTY_DB_MODULE="$RUNNER_TEMP/faculty-db/node_modules/@electric-sql/pglite/dist/index.js" node --test tests/manual-assignment-restoration-db.test.mjs tests/assignment-candidate-scope-db.test.mjs
