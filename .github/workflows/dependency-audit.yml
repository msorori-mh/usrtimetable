name: dependency-audit

# M-29: weekly supply-chain audit of the locked dependency tree. Fails on high or critical
# advisories. Document any accepted risk in docs/operations/dependency-overrides.md.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1" # weekly, Monday 04:41 UTC
  pull_request:
    paths:
      - package.json
      - bun.lock
      - .github/workflows/dependency-audit.yml

permissions:
  contents: read

jobs:
  audit:
    name: bun audit (high / critical)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Audit
        run: bun audit --audit-level=high
      - name: Lockfile sources outside the public npm registry
        run: |
          count=$(grep -c 'https://europe-west[0-9]*-npm.pkg.dev/lovable-core-prod' bun.lock || true)
          echo "::notice title=private registry entries::$count lockfile entries resolve to Lovable's registry mirror (see docs/operations/dependency-overrides.md)"
