name: dependency-audit

# M-29: weekly supply-chain audit of the locked dependency tree. Fails on high or critical
# advisories. Document any accepted risk in docs/operations/dependency-overrides.md.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1" # weekly, Monday 04:41 UTC
  pull_request:
    paths:
      - package.json
      - bun.lock
      - .github/workflows/dependency-audit.yml

permissions:
  contents: read

jobs:
  audit:
    name: bun audit (high / critical)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Audit
        run: bun audit --audit-level=high
      - name: Lockfile sources outside the public npm registry
        run: |
          # Every entry must resolve to the public npm registry (empty URL = default registry).
          count=$(grep -cE '"https://[a-z0-9-]+-npm\.pkg\.dev/' bun.lock || true)
          if [ "$count" != "0" ]; then
            echo "::warning title=private registry entries::$count lockfile entries resolve to a private registry mirror; run scripts/exit-lovable/regenerate-lockfile.sh"
          fi
