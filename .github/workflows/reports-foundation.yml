name: reports-foundation
on:
  pull_request:
    branches: [main]
  push:
    branches: ["codex/reports-foundation-*"]
permissions:
  contents: read
jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Report calculations and existing contracts
        run: |
          node --import tsx --test tests/teaching-pay.test.ts tests/system-hours.test.ts tests/system-hours-report.test.mjs tests/whole-cohort-group-labels.test.ts tests/reports-foundation.test.ts tests/academic-affairs.test.ts tests/program-timetable-filters.test.ts tests/schedule-report-filename.test.ts
          bun test tests/report-visual-system.test.ts tests/program-timetable-coverage.test.ts tests/program-timetable-order.test.ts tests/program-timetable-shared.test.ts tests/instructor-pdf-archive.test.ts tests/weekly-grid-window.test.ts tests/reports-college-switch.test.ts tests/instructor-quota-and-directory.test.ts tests/report-print-identity.test.ts
      - name: Browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/report-qa" --no-package-lock @playwright/test@1.63.0
          node "$RUNNER_TEMP/report-qa/node_modules/@playwright/test/cli.js" install --with-deps chromium
      - name: Report interaction and print proof
        run: |
          bunx vite --config scripts/reports-proof/vite.config.mts > "$RUNNER_TEMP/report-preview.log" 2>&1 &
          REPORT_QA_MODULES="$RUNNER_TEMP/report-qa/node_modules" node scripts/reports-proof/check.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-foundation-proof
          path: reports-proof-output
