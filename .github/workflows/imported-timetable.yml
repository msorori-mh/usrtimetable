name: Imported timetable source reports
on:
  push:
    branches: ["codex/education-source-reports-20260923"]
  pull_request:
    paths:
      - "src/lib/reports/imported-timetable.ts"
      - "src/components/data-onboarding/**"
      - "tests/imported-timetable.test.mjs"
      - ".github/workflows/imported-timetable.yml"
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/imported-timetable.test.mjs
