name: repeated-report-header
on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/reports/**"
      - "src/components/print-center/**"
      - "src/routes/_authenticated/reports.rooms-report.tsx"
      - "src/routes/_authenticated/reports.instructor-schedule.tsx"
      - "src/lib/reports/university-instructor-schedule.ts"
      - "src/lib/reports/queries/university-instructor-schedule.ts"
      - "tests/university-instructor-schedule.test.ts"
      - "src/styles.css"
      - "src/lib/print-center/**"
      - "scripts/reports-proof/**"
      - ".github/workflows/repeated-report-header.yml"
permissions:
  contents: read
jobs:
  physical-pages:
    # Pinned: font rendering (and so PDF pagination/text extraction) changes with the image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: node --import tsx --test tests/rooms-executive.test.ts
      - run: bun test tests/university-instructor-schedule.test.ts tests/student-print-memberships.test.ts
      - run: |
          npm install --prefix "$RUNNER_TEMP/report-qa" --no-package-lock @playwright/test@1.63.0
          node "$RUNNER_TEMP/report-qa/node_modules/@playwright/test/cli.js" install --with-deps chromium
          pip install "pymupdf==1.24.10"
      - name: Verify repeated headers on every physical page
        run: |
          bunx vite --config scripts/reports-proof/vite.config.mts > "$RUNNER_TEMP/report-preview.log" 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:4173/repeated-header.html >/dev/null && break; sleep 1; done
          REPORT_QA_MODULES="$RUNNER_TEMP/report-qa/node_modules" node scripts/reports-proof/repeated-header.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: repeated-header-proof
          path: repeated-header-proof
