name: Atomic generation regression
on:
  pull_request:
    paths:
      - "src/lib/auto-scheduler/**"
      - "src/lib/scheduling/**"
      - "supabase/migrations/**"
      - "supabase/sql/**"
      - "tests/**"
      - ".github/workflows/atomic-generation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: generation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Model and real generation orchestration
        run: node --test tests/joint-model.test.mjs tests/generation-rearrangement.test.mjs tests/v2-joint-orchestration.test.mjs tests/student-daily-policy.test.mjs
      - name: Bounded repair and instructor exceptions
        run: bun test tests/auto-schedule-repair.test.ts tests/instructor-attendance-target.test.ts tests/instructor-attendance-target-priority.test.ts
      - name: Staging isolation and deployment workflow contracts
        run: node --test tests/staging-deploy-preflight.test.mjs tests/staging-deploy-workflow.test.mjs tests/cohort-component-single-instructor-contract.test.mjs
      - name: Fixed instructor rule and slot availability behavior
        run: node --import tsx --test tests/cohort-component-single-instructor.test.ts tests/instructor-slot-availability.test.ts
      - name: Policy status and instructor perspective behavior
        run: bunx vitest run --config tests/vitest-bun-compat.config.mjs tests/instructor-perspective.test.ts tests/instructor-availability-status.test.ts tests/instructor-availability-reactivation.test.ts
      - name: Install split-group database test runtime
        run: npm install --prefix "$RUNNER_TEMP/cohort-rule-db" --no-package-lock @electric-sql/pglite@0.3.14
      - name: One instructor per split cohort component in disposable PostgreSQL
        env:
          COHORT_RULE_DB_MODULE: ${{ runner.temp }}/cohort-rule-db/node_modules/@electric-sql/pglite/dist/index.js
        run: node --test tests/cohort-component-single-instructor-db.test.mjs
      - name: Actual PostgreSQL rollback and permissions
        env:
          PGPASSWORD: disposable_test_only
        run: psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d generation_test -f tests/generation-atomic-db.sql
