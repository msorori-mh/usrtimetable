name: prod-db-credential-preflight

on:
  push:
    branches: [instructor-restructure-ready]
    paths:
      - .github/workflows/prod-db-credential-preflight.yml

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check credential availability without exposing values
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD DATABASE_URL PRODUCTION_DATABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -n "${!name}" ]; then
              echo "$name=present"
            else
              echo "$name=absent"
            fi
          done
