name: password-onboarding
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  password-onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: npm install --prefix "$RUNNER_TEMP/password-qa" --no-package-lock @electric-sql/pglite@0.3.14 jsdom@26.1.0
      - run: PASSWORD_QA_MODULES="$RUNNER_TEMP/password-qa/node_modules" node --import tsx --test tests/password-onboarding.test.mjs tests/admin-password-reset.test.mjs tests/admin-password-reset-ui.test.mjs tests/mfa-auth-contract.test.mjs tests/supabase-public-config.test.mjs tests/security-rate-limit-audit-contract.test.mjs tests/report-access-recovery-db.test.mjs
