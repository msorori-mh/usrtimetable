name: password-onboarding
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  password-onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: npm install --prefix "$RUNNER_TEMP/password-qa" --no-package-lock @electric-sql/pglite@0.5.8
      - run: PASSWORD_QA_MODULES="$RUNNER_TEMP/password-qa/node_modules" node --import tsx --test tests/password-onboarding.test.mjs
